        ];

        const sectionsBranches = [
            { title: "تجربة العميل والتشغيل", items: [{id:1, ar:"تشيك واجهة المطعم والمدخل"},{id:2, ar:"تشيك الصالات والجدران والأرضية"},{id:3, ar:"تشيك الحمامات"},{id:4, ar:"تشيك الكاشير والنت والتطبيقات"},{id:5, ar:"متابعة قوقل ماب"},{id:6, ar:"تشيك قسم العصائر"},{id:7, ar:"تشيك المستودع"},{id:8, ar:"تشيك صالة 2"},{id:9, ar:"تشيك حمام صالة 2"},{id:10, ar:"تشيك الأشجار"},{id:11, ar:"تشيك القسم الخلفي والغاز"},{id:12, ar:"تشيك العمال والنظافة الشخصية"},{id:13, ar:"رفع الطلبات حسب الجدول"},{id:14, ar:"تشيك الطلبات"},{id:15, ar:"تشيك عام للمرافق"},{id:16, ar:"تشيك كشف الحضور"},{id:17, ar:"الاجتماع اليومي"},{id:18, ar:"متابعة مهام المشرفين"}]}
        ];

        // التحقق والمزامنة
        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("authorized_users").where("email", "==", user.email.toLowerCase().trim()).get().then(snap => {
                    if (user.email === ADMIN_MAIN || (!snap.empty && snap.docs[0].data().role === 'admin')) {
                        document.getElementById('lockScreen').classList.add('hidden'); startSync();
                    } else { window.location.href = "index.html"; }
                });
            } else { window.location.href = "index.html"; }
        });

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI(); renderAnalytics();
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
        }

        function fixNums(str) { return str ? str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }
        function hasAnyNo(report) { if (!report.answers) return false; return Object.values(report.answers).some(a => a === 'no'); }

        function renderAnalytics() {
            if (cloudReports.length === 0) return;
            const branchData = {};
            cloudReports.forEach(r => {
                if (!branchData[r.branch]) branchData[r.branch] = { sum: 0, count: 0 };
                branchData[r.branch].sum += (parseFloat(r.score) || 0);
                branchData[r.branch].count += 1;
            });
            const ctx = document.getElementById('branchChart').getContext('2d');
            if (branchChart) branchChart.destroy();
            const labels = Object.keys(branchData);
            const data = labels.map(l => Math.round(branchData[l].sum / branchData[l].count));
            branchChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: data.map(v => v >= 50 ? '#1C780B' : '#D91414'), borderRadius: 8 }] },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }

        function updateUI() {
            const scoreEl = document.getElementById('totalScore');
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                let avg = Math.round(sum / cloudReports.length);
                scoreEl.innerText = fixNums(avg) + "%";
                scoreEl.className = `text-3xl font-black ${avg >= 50 ? 'text-verra-green' : 'text-verra-red'}`;
            }
            renderReportsList();
        }

        function renderReportsList() {
            const search = document.getElementById('reportSearch').value.toLowerCase();
            const filtered = cloudReports.filter(r => {
                const matchesSearch = (r.branch + (r.inspector || "")).toLowerCase().includes(search);
                let matchesTab = true;
                if (currentTab === 'quality') matchesTab = (r.type?.includes('Quality'));
                else if (currentTab === 'branches') matchesTab = (r.type === 'Branch Report');
                else if (currentTab === 'checklist') matchesTab = (r.type === 'Assistant Checklist');
                return matchesSearch && matchesTab;
            });
            const alertCount = filtered.filter(r => hasAnyNo(r) && !r.resolved).length;
            if(document.getElementById('sumAlerts')) document.getElementById('sumAlerts').innerText = fixNums(alertCount);
            document.getElementById('reportsList').innerHTML = filtered.map((r) => {
                const isPass = parseFloat(r.score) >= 50;
                return `<div onclick="viewDetail('${r.docId}')" class="verra-card p-5 border-r-8 ${isPass ? 'border-verra-green' : 'border-verra-red'} mb-4 flex justify-between items-center text-right shadow-sm"><div class="flex items-center gap-3"><button onclick="event.stopPropagation(); if(confirm('حذف؟')) db.collection('inspections').doc('${r.docId}').delete()" class="text-gray-300 p-2 text-right">🗑️</button><div class="${isPass ? 'bg-[#1C780B]' : 'bg-[#D91414]'} text-white px-3 py-1 rounded-full text-xs font-black shadow-sm">${fixNums(r.score)}%</div></div><div class="text-right"><h4>${hasAnyNo(r) && !r.resolved ? '<span class="blink-alert">🚨</span>' : ''}${r.resolved ? '✅' : ''}${r.branch}</h4><div class="text-[10px] text-gray-400 font-bold uppercase text-right">📅 ${fixNums(r.date)} | 👤 ${r.inspector?.split('@')[0]}</div></div></div>`;
            }).join('');
        }

        function viewDetail(docId) {
            const r = cloudReports.find(x => x.docId === docId);
            const isViolation = hasAnyNo(r);
            const isResolved = r.resolved === true;
            document.getElementById('detailBody').innerHTML = `<div class="bg-gray-50 p-6 rounded-3xl text-center border shadow-sm text-right"><h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase text-right">${r.branch}</h2><p class="text-xs font-bold text-gray-400 mb-4">📅 ${fixNums(r.date)} | 👤 ${r.inspector}</p><div class="text-6xl font-black ${r.score >= 50 ? 'text-verra-green' : 'text-verra-red'}">${fixNums(r.score)}%</div></div>`;
            const btnArea = document.getElementById('actionButtons');
            if (isViolation && !isResolved) { btnArea.innerHTML = `<button onclick="resolveReport('${docId}')" class="w-full bg-green-600 text-white p-4 rounded-2xl font-black shadow-lg">✅ تم استلام تأكيد المعالجة والإصلاح</button>`; } else { btnArea.innerHTML = ''; }
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r, false);
            document.getElementById('emailBtn').onclick = () => generateFullPDF(r, true);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        async function resolveReport(docId) { if (confirm("تأكيد الإصلاح؟")) { await db.collection("inspections").doc(docId).update({ resolved: true }); closeModal(); } }

        // --- محرك الـ PDF الكامل والنهائي (إصلاح مشكلة الاختصار والخط) ---
        async function generateFullPDF(r, shouldShare) {
            const btnTextEl = document.getElementById('btnText');
            const originalText = btnTextEl.innerText;
            btnTextEl.innerText = "جاري البناء الكامل بخط Cairo... ⏳";
            
            let targetSections = sectionsAssistant;
            if (r.type?.includes("Quality")) targetSections = sectionsQuality;
            if (r.type === "Branch Report") targetSections = sectionsBranches;

            let allPhotos = {...(r.photos || {})};
            if (r.hasExtra || r.hasMorePhotos) {
                try {
                    const extraSnap = await db.collection("inspection_attachments").doc(r.docId).get();
                    if (extraSnap.exists) {
                        const extraData = extraSnap.data().photos;
                        Object.keys(extraData).forEach(k => { allPhotos[k] = [...(allPhotos[k] || []), ...extraData[k]]; });
                    }
                } catch(e) {}
            }

            // بناء المحتوى مع تصفية الأقسام الفارغة
            let contentHtml = targetSections.filter(sec => sec.items.some(item => r.answers && r.answers[item.id])).map(sec => {
                let itemsHtml = sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : null;
                    if (!ans) return "";
                    const note = (r.notes && r.notes[i.id]) ? r.notes[i.id] : "";
                    const pics = allPhotos[i.id] || [];
                    let statusColor = ans === 'yes' ? '#1C780B' : ans === 'no' ? '#D91414' : '#64748b';
                    let statusTxt = ans === 'yes' ? 'مطابق ✅' : ans === 'no' ? 'مخالفة ❌' : 'غير متوفر';
                    return `
                        <div style="padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: right; page-break-inside: avoid; display: block; clear: both; width: 100%;">
                            <div style="font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 14px; color: #1e293b; direction: rtl; text-align: right; line-height: 1.6; margin-bottom: 10px;">${i.ar || i.q}</div>
                            <div style="margin-bottom: 10px;"><span style="font-family: 'Cairo', sans-serif; font-size: 12px; color: ${statusColor}; font-weight: bold; background: ${statusColor}10; padding: 4px 12px; border-radius: 6px;">الحالة: ${statusTxt}</span></div>
                            ${note ? `<div style="background:#fff9e6; padding:8px; border-radius:8px; font-size:11px; margin-bottom:10px; color:#92400e; font-family: 'Cairo', sans-serif;"><b>الملاحظة:</b> ${note}</div>` : ""}
                            <div style="width: 100%; display: block; text-align: right; clear: both;">
                                ${pics.map(p => `<div style="display: inline-block; width: 30%; margin-left: 1%; margin-bottom: 10px; vertical-align: top;"><img src="${p}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 12px; border: 2px solid #eee; display: block;" /></div>`).join('')}
                            </div>
                        </div>`;
                }).join('');
                return `<div style="page-break-inside: avoid; clear: both;"><div style="font-family: 'Cairo', sans-serif; background: #f0fdf4; padding: 12px 20px; border-right: 10px solid #d1ba89; color: #004b47; font-weight: 900; margin-top: 30px; text-align: right; font-size: 18px;">${sec.title}</div>${itemsHtml}</div>`;
            }).join('');

            const html = `
            <div style="width: 800px; margin: 0 auto; padding: 40px; background: white; direction: rtl; text-align: right; box-sizing: border-box; font-family: 'Cairo', sans-serif;">
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
                <div style="text-align: center; margin-bottom: 30px;">
                    <img src="${LOGO_URL}" style="height: 100px; margin-bottom: 15px;" />
                    <div style="color: #004b47; font-size: 32px; font-weight: 900; border-bottom: 5px solid #d1ba89; display: inline-block; padding-bottom: 8px;">تقرير التدقيق الرسمي لـ فيرا برو</div>
                </div>
                <div style="background: #f8fafc; padding: 25px; border-radius: 20px; margin-bottom: 40px; display: table; width: 100%;">
                    <div style="display: table-cell; width: 70%; line-height: 2.2; vertical-align: middle; text-align: right;"><b>🏢 المنشأة:</b> ${r.branch}<br><b>👤 المسؤول:</b> ${r.inspector}<br><b>📅 التاريخ:</b> ${fixNums(r.date)}<br><b>الحالة:</b> ${r.resolved?'تمت المعالجة ✅':'قيد المتابعة'}</div>
                    <div style="display: table-cell; width: 30%; text-align: center; border-right: 4px solid #004b47; vertical-align: middle;">
                        <div style="font-size: 55px; font-weight: 900; color: ${parseFloat(r.score) >= 50 ? '#1C780B':'#D91414'};">${fixNums(r.score)}%</div>
                    </div>
                </div>
                ${contentHtml}
                <div style="margin-top: 60px; border-top: 3px solid #eee; padding-top: 25px; page-break-inside: avoid; text-align: right;"><p style="font-weight: 900; color: #004b47; font-size: 20px;">التوقيع:</p><img src="${r.signature}" style="width: 350px; height: 130px; object-fit: contain; display: block;" /></div>
            </div>`;
            
            const opt = { margin: [10, 10], filename: `Report_${r.branch}.pdf`, image: { type: 'jpeg', quality: 1.0 }, html2canvas: { scale: 1.5, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            const worker = html2pdf().from(html).set(opt);
            if (shouldShare && navigator.share) {
                const pdfBlob = await worker.output('blob');
                const file = new File([pdfBlob], `Report_${r.branch}.pdf`, { type: 'application/pdf' });
                try { await navigator.share({ files: [file], title: 'تقرير فيرا برو', text: `تقرير فرع ${r.branch}` }); } catch (err) {}
            } else { await worker.save(); }
            btnTextEl.innerText = originalText;
        }

        function renderUsers() {
            const roleOrder = { 'admin': 1, 'quality': 2, 'supervisor': 3, 'assistant': 4 };
            const activeFiltered = cloudUsers.sort((a, b) => (roleOrder[a.role] || 99) - (roleOrder[b.role] || 99));
            document.getElementById('activeUsersList').innerHTML = activeFiltered.map(u => {
                let roleStyles = { admin: { bg: 'bg-black text-white', name: 'الإدارة العامة' }, quality: { bg: 'bg-purple-100 text-purple-600', name: 'مشرف جودة' }, supervisor: { bg: 'bg-blue-100 text-blue-600', name: 'مشرف فروع' }, assistant: { bg: 'bg-orange-100 text-orange-600', name: 'مساعد مشرف فروع' } };
                let style = roleStyles[u.role] || { bg: 'bg-gray-100', name: 'عضو' };
                return `<div class="bg-white rounded-[25px] p-5 flex justify-between items-center shadow-sm border mb-4 text-right"><div class="flex items-center gap-4 text-right text-right"><h5 class="font-black text-gray-800 text-sm text-right">${u.email.split('@')[0]}</h5><span class="${style.bg} text-[9px] font-black px-3 py-1 rounded-lg uppercase tracking-wider text-right">${style.name}</span><div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-xl text-right">👤</div></div><button onclick="if(confirm('سحب؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-gray-300 hover:text-red-500 p-2 text-right">🗑️</button></div>`;
            }).join('');
        }

        function setReportTab(t) { currentTab = t; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); renderReportsList(); }
        function navigateTo(id) { document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        startSync();
    </script>
</body>
</html>
