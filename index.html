<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- أضف هذه الأسطر تحت الـ <title> مباشرة -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VerraPro">
<link rel="apple-touch-icon" href="https://verrapizza.github.io/verra/verralogo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - بوابة الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .loading-overlay { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-col; items-center; justify-content: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const ADMIN_MAIN = "ch3f.ramzi@gmail.com";

    function App() {
      const [email, setEmail] = useState("");
      const [pass, setPass] = useState("");
      const [loading, setLoading] = useState(true);
      const [btnLoading, setBtnLoading] = useState(false);
      const [isRegistering, setIsRegistering] = useState(false);

      useEffect(() => {
        // فحص الجلسة الحالية
        const unsubscribe = auth.onAuthStateChanged(user => {
          if (user) {
            handleRedirection(user.email);
          } else {
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      const handleRedirection = async (userEmail) => {
        const emailLower = userEmail.toLowerCase().trim();
        
        // 1. إذا كان الآدمن الرئيسي
        if (emailLower === ADMIN_MAIN) {
          window.location.href = "admin.html";
          return;
        }

        try {
          // 2. فحص رتبة المستخدم من قاعدة البيانات
          const snap = await db.collection("authorized_users").where("email", "==", emailLower).get();
          
          if (!snap.empty) {
            const role = snap.docs[0].data().role;
            
            if (role === 'admin') {
              window.location.href = "admin.html";
            } else if (role === 'quality') {
              window.location.href = "quality-inspection.html";
            } else if (role === 'supervisor') {
              window.location.href = "branches-inspector.html";
            } else if (role === 'assistant') {
              window.location.href = "checklist.html";
            } else {
              alert("⚠️ لم يتم تحديد صلاحية صحيحة لك.");
              auth.signOut();
              setLoading(false);
            }
          } else {
            // 3. فحص إذا كان في الانتظار
            const pSnap = await db.collection("pending_authorizations").where("email", "==", emailLower).get();
            if (!pSnap.empty) {
              alert("⏳ حسابك قيد المراجعة، سيتم تفعيله من قبل الإدارة قريباً.");
            } else {
              alert("⚠️ البريد غير مسجل في النظام.");
            }
            auth.signOut();
            setLoading(false);
          }
        } catch (e) {
          console.error(e);
          setLoading(false);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setBtnLoading(true);
        try {
          if (isRegistering) {
            await auth.createUserWithEmailAndPassword(email, pass);
            await db.collection("pending_authorizations").add({ 
              email: email.toLowerCase().trim(), 
              requested_at: new Date().toISOString() 
            });
            alert("✅ تم إرسال طلب الانضمام بنجاح.");
            setIsRegistering(false);
          } else {
            await auth.signInWithEmailAndPassword(email, pass);
          }
        } catch (err) {
          alert("خطأ: " + err.message);
        } finally {
          setBtnLoading(false);
        }
      };

      if (loading) return (
        <div className="loading-overlay flex-col">
          <div className="w-12 h-12 border-4 border-t-[#004b47] border-gray-200 rounded-full animate-spin mb-4"></div>
          <p className="font-bold text-[#004b47]">جاري تهيئة نظام فيرا...</p>
        </div>
      );

      return (
        <div className="h-screen verra-gradient flex items-center justify-center p-6 text-right">
          <form onSubmit={handleLogin} className="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center">
            <img src="https://verrapizza.github.io/inspection/verralogo.png" className="h-20 mx-auto mb-6" />
            <h1 className="text-xl font-black text-green-950 mb-8 uppercase tracking-tighter">
              {isRegistering ? "طلب انضمام للفريق" : "تسجيل الدخول"}
            </h1>
            
            <input 
              className="w-full border p-4 rounded-2xl mb-3 text-right outline-none font-bold bg-gray-50" 
              placeholder="البريد الإلكتروني" 
              type="email"
              value={email} 
              onChange={e => setEmail(e.target.value)} 
              required
            />
            
            <input 
              className="w-full border p-4 rounded-2xl mb-6 text-right outline-none font-bold bg-gray-50" 
              type="password" 
              placeholder="كلمة المرور" 
              value={pass} 
              onChange={e => setPass(e.target.value)} 
              required
            />
            
            <button 
              type="submit" 
              disabled={btnLoading} 
              className="w-full bg-[#004b47] text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition text-lg mb-4"
            >
              {btnLoading ? "جاري العمل..." : (isRegistering ? "إرسال طلب" : "دخول")}
            </button>
            
            <p 
              onClick={() => setIsRegistering(!isRegistering)} 
              className="text-xs font-bold text-gray-400 cursor-pointer underline"
            >
              {isRegistering ? "لديك حساب؟ سجل دخولك" : "موظف جديد؟ اطلب تفعيل من هنا"}
            </p>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
